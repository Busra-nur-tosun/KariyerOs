<section class="mx-auto flex min-h-[calc(100vh-96px)] max-w-[720px] items-center justify-center px-6 py-16">
  <div class="w-full rounded-[2rem] border border-white/75 bg-white/85 p-10 text-center shadow-[0_28px_80px_rgba(44,74,126,0.16)] backdrop-blur">
    <p class="text-sm font-semibold uppercase tracking-[0.24em] text-[#3153db]">Google Auth</p>
    <h1 class="mt-3 text-[2.1rem] font-extrabold tracking-[-0.06em] text-[#16213d]">Google oturumu tamamlanıyor</h1>

    @if (errorMessage(); as error) {
      <div class="mt-6 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-4 text-sm font-medium text-rose-700">
        {{ error }}
      </div>

      <div class="mt-6 flex justify-center gap-4">
        <a routerLink="/login" class="rounded-2xl border border-[#3153db] px-5 py-3 text-sm font-semibold text-[#3153db] transition hover:bg-[#eef3ff]">
          Giris sayfasina don
        </a>
        <a routerLink="/register" class="rounded-2xl bg-[#1e9dc3] px-5 py-3 text-sm font-semibold text-white transition hover:bg-[#1784a4]">
          Kayit sayfasina don
        </a>
      </div>
    } @else {
      <p class="mt-4 text-base leading-7 text-[#6b7a93]">
        Hesabiniz dogrulaniyor ve panelinize yonlendiriliyorsunuz.
      </p>
      <div class="mx-auto mt-8 h-12 w-12 animate-spin rounded-full border-4 border-[#d9e5ff] border-t-[#3153db]"></div>
    }
  </div>
</section>
